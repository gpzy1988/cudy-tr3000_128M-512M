name: 1 ImmortalWrt TTYd 网页终端编译生成器

on:
  repository_dispatch:
    types: [ "Source Code Update" ]
  workflow_dispatch:
    inputs:
      device:
        description: '编译设备型号'
        required: true
        type: choice
        default: 'all'
        options:
          - '512M'
          - '256M'
          - '128M'
          - '128M-Ubootmod'
          - 'DIY Custom'
          - 'all' 
      repo:
        description: '指定 OpenWrt 源码仓库地址'
        required: true
        type: string
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
      branch:
        description: '指定源码分支，留空拉取最新'
        required: false
        type: string
        default: 'openwrt-24.10-6.6'
      commit:
        description: '指定源码提交哈希，留空不锁定版本'
        required: false
        type: string
        default: ''
      web_terminal:
        description: '开启 TTYd 网页终端（仅非 all 设备生效）'
        required: false
        type: boolean
        default: false
      terminal_password:
        description: '自定义网页终端访问密码，默认密码 openwrt123'
        required: false
        type: string
        default: 'openwrt123'
      release:
        description: '编译完成后自动发布到 GitHub Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device }}
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 6G
  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo }}
  REPO_BRANCH: ${{ github.event.inputs.branch }}
  REPO_COMMIT: ${{ github.event.inputs.commit }}
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TERMINAL_PASS: ${{ github.event.inputs.terminal_password }}
  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release }}
  PRERELEASE: ${{ github.event.inputs.prerelease }}
  TZ: Asia/Shanghai

jobs:
  web-terminal-config:
    name: ⚙️ TTYd 网页终端配置
    if: github.event.inputs.web_terminal == 'true' && github.event.inputs.device != 'all'
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 初始化基础依赖环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libncurses-dev build-essential git wget python3 bzip2 lsof
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 OpenWrt 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 绑定对应设备的配置文件
        run: |
          case "$DEVICE_INPUT" in
            "512M") echo "CONFIG_FILE=config/512m.config" >> $GITHUB_ENV ;; 
            "256M") echo "CONFIG_FILE=config/256m.config" >> $GITHUB_ENV ;;
            "128M") echo "CONFIG_FILE=config/128m.config" >> $GITHUB_ENV ;;
            "128M-Ubootmod") echo "CONFIG_FILE=config/128muboot.config" >> $GITHUB_ENV ;;
            "DIY Custom") echo "CONFIG_FILE=config/diy-custom.config" >> $GITHUB_ENV ;;
          esac

      - name: 加载 Feeds 与初始配置
        run: |
          [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH $GITHUB_WORKSPACE/$DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          [ -e $GITHUB_WORKSPACE/${CONFIG_FILE} ] && cp -f $GITHUB_WORKSPACE/${CONFIG_FILE} .config
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig

      - name: 启动 TTYd 服务 + Cloudflare 内网穿透隧道
        run: |
          # 1. 下载 TTYd 二进制程序
          wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x ttyd.x86_64
          
          # 2. 下载 Cloudflared 二进制程序 (直接使用二进制文件避免 dpkg 权限问题)
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          
          # 3. 端口清理：杀死可能占用 7681 端口的残留进程
          sudo lsof -i :7681 | awk 'NR>1 {print $2}' | xargs sudo kill -9 2>/dev/null || true
          
          # 4. 启动 TTYd：修复参数格式，使用 -- 分隔选项与命令
          nohup ./ttyd.x86_64 -p 7681 -c ":$TERMINAL_PASS" -t enableTracing=false -- bash -i &
          
          echo "⏳ 正在生成公网隧道链接，等待 10 秒..."
          sleep 10
          
          # 5. 启动 Cloudflare 隧道：移除已废弃的 --websocket 标志
          nohup ./cloudflared-linux-amd64 tunnel --url http://localhost:7681 --no-autoupdate > tunnel.log 2>&1 &
          
          sleep 15
          
          # 6. 提取隧道链接
          TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9\-]+\.trycloudflare\.com' tunnel.log | head -n 1)
          
          # 7. 异常处理
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ 隧道启动失败，完整日志如下："
            cat tunnel.log
            exit 1
          fi
          
          echo "========================================"
          echo "✅ 网页终端已成功启动！"
          echo "🔗 访问地址：$TUNNEL_URL"
          echo "🔑 终端密码：$TERMINAL_PASS"
          echo "⚠️  请保持当前 Workflow 页面打开，你有 30 分钟操作时间"
          echo "💡 操作完成后手动取消当前 Workflow 运行，配置会自动保存回仓库"
          echo "========================================"
          
          # 8. 阻塞进程保持会话运行
          tail -f /dev/null
        timeout-minutes: 30

      - name: 保存自定义配置回仓库
        if: success() || failure() || cancelled()
        run: |
          [ ! -f /workdir/openwrt/.config ] && make -C /workdir/openwrt defconfig
          cp -f /workdir/openwrt/.config $GITHUB_WORKSPACE/${CONFIG_FILE} || true
          
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git stash push -m "auto-stash before pull"
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull origin $CURRENT_BRANCH --rebase
          git stash pop || true
          
          git add $CONFIG_FILE
          git diff --cached --quiet || (
            git commit -m "Update config: ${CONFIG_FILE}"
            git push origin $CURRENT_BRANCH
          )

  build-firmware:
    name: 🔨 固件编译
    needs: web-terminal-config
    if: always() && (needs.web-terminal-config.result == 'success' || needs.web-terminal-config.result == 'skipped' || needs.web-terminal-config.result == 'cancelled')
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取配置仓库代码
        uses: actions/checkout@v4

      - name: 初始化完整编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd libncurses5-dev liblzo2-dev lzop
          sudo apt-get autoremove --purge -qq
          sudo apt-get clean -qq
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 OpenWrt 源码并切换指定 Commit
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          cd openwrt
          if [ -n "${REPO_COMMIT}" ]; then git checkout $REPO_COMMIT; fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 加载自定义 Feeds 脚本
        run: |
          [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH $GITHUB_WORKSPACE/$DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 生成配置哈希指纹用于缓存
        id: config-hash
        run: |
          FIRST_DEV_CONFIG="config/512m.config"
          if [ "${DEVICE_INPUT}" != "all" ]; then
            case "$DEVICE_INPUT" in
              "512M") FIRST_DEV_CONFIG="config/512m.config" ;;
              "256M") FIRST_DEV_CONFIG="config/256m.config" ;;
              "128M") FIRST_DEV_CONFIG="config/128m.config" ;;
              "128M-Ubootmod") FIRST_DEV_CONFIG="config/128muboot.config" ;;
              "DIY Custom") FIRST_DEV_CONFIG="config/diy-custom.config" ;;
            esac
          fi
          [ ! -e $GITHUB_WORKSPACE/$FIRST_DEV_CONFIG ] && touch $GITHUB_WORKSPACE/$FIRST_DEV_CONFIG
          cp -f $GITHUB_WORKSPACE/$FIRST_DEV_CONFIG openwrt/.config
          cd openwrt && make defconfig
          CONFIG_HASH=$(md5sum .config | awk '{print $1}')
          echo "hash=$CONFIG_HASH" >> $GITHUB_OUTPUT

      - name: 缓存编译中间产物 (ccache)
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-

      - name: 缓存下载依赖包 (dl)
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-dl-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-dl-${{ env.REPO_BRANCH }}-

      - name: 配置加速编译缓存
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z

      - name: 多设备批量编译
        id: compile
        run: |
          if [ "${DEVICE_INPUT}" = "all" ]; then
            DEVICES="512M 256M 128M 128M-Ubootmod"
          else
            DEVICES="${DEVICE_INPUT}"
          fi
          mkdir -p $GITHUB_WORKSPACE/firmware_collection
          cd /workdir/openwrt
          for DEV in $DEVICES; do
            echo "::group::🚀 正在编译设备 $DEV"
            case "$DEV" in
              "512M") CONFIG="config/512m.config" ;;
              "256M") CONFIG="config/256m.config" ;;
              "128M") CONFIG="config/128m.config" ;;
              "128M-Ubootmod") CONFIG="config/128muboot.config" ;;
              "DIY Custom") CONFIG="config/diy-custom.config" ;;
            esac
            [ ! -e $GITHUB_WORKSPACE/$CONFIG ] && touch $GITHUB_WORKSPACE/$CONFIG
            cp -f $GITHUB_WORKSPACE/$CONFIG .config
            make defconfig
            make download -j$(nproc)
            find dl -size -1024c -exec rm -f {} \;
            if make -j$(nproc) CC="ccache gcc" CXX="ccache g++"; then
              echo "✅ $DEV 编译成功"
            else
              make -j1 V=s || exit 1
            fi
            echo "::endgroup::"
          done
          ccache -s
          find bin/targets -type f $ -name "*sysupgrade.bin" -o -name "*factory.bin" -o -name "*.img" -o -name "*.tar.gz" $ -exec cp {} $GITHUB_WORKSPACE/firmware_collection/ \; 2>/dev/null || true
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件制品
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_${{ env.DEVICE_INPUT }}
          path: ${{ github.workspace }}/firmware_collection/*
          compression-level: 9

      - name: 生成发布标签信息
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          BUILD_TIME=$(date +"%Y.%m.%d-%H%M")
          echo "release_tag=$BUILD_TIME" >> $GITHUB_OUTPUT
          cat > release.txt << EOF
          ## 📦 ImmortalWrt 固件发布
          &zwnj;**发布标签:**&zwnj; $BUILD_TIME
          &zwnj;**源码分支:**&zwnj; $REPO_BRANCH
          &zwnj;**编译设备:**&zwnj; ${DEVICE_INPUT}
          EOF
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布固件到 Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            /workdir/openwrt/bin/targets/*/*/*sysupgrade.bin
            /workdir/openwrt/bin/targets/*/*/*factory.bin

      - name: 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5

      - name: 清理旧的 Release 版本
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
