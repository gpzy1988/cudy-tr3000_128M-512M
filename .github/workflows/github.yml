name: 2ImmortalWrt 固件自动编译构建器

on:
  repository_dispatch:
    types: [ "源码更新触发" ]
  workflow_dispatch:
    inputs:
      device:
        description: '编译目标设备型号'
        required: true
        type: choice
        default: '全部设备'
        options:
          - '512M'
          - '256M'
          - '128M'
          - '128M-Uboot修改版'
          - '全部设备' 
      repo:
        description: '指定OpenWrt源码仓库地址'
        required: true
        type: string
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
      branch:
        description: '指定源码分支，留空则拉取最新分支'
        required: false
        type: string
        default: 'openwrt-24.10-6.6'
      commit:
        description: '指定源码提交版本，留空则拉取最新提交'
        required: false
        type: string
        default: 'openwrt-24.10-6.6'
      ssh:
        description: '开启交互式SSH配置终端（全部设备模式下该选项无效）'
        required: false
        type: boolean
        default: false
      release:
        description: '将编译完成的固件发布到GitHub Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '标记为预发布测试版本'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

env:
  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device }}
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 6G
  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo }}
  REPO_BRANCH: ${{ github.event.inputs.branch }}
  REPO_COMMIT: ${{ github.event.inputs.commit }}
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release }}
  PRERELEASE: ${{ github.event.inputs.prerelease }}
  TZ: Asia/Shanghai

jobs:
  tmate-selfhost-server:
    name: 🚀 部署私有tmate服务端
    runs-on: ubuntu-22.04
    if: github.event.inputs.ssh == 'true'
    outputs:
      server-host: ${{ steps.info.outputs.server-host }}
      server-port: ${{ steps.info.outputs.server-port }}
      rsa-fingerprint: ${{ steps.info.outputs.rsa-fingerprint }}
      ed25519-fingerprint: ${{ steps.info.outputs.ed25519-fingerprint }}
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
      
      - name: 修复依赖冲突并安装Docker
        run: |
          # 1. 解除所有被 hold 的包限制
          sudo apt-mark unhold $(sudo apt-mark showhold) || true
          
          # 2. 强制卸载所有与 Docker/Containerd 相关的预装包
          sudo apt-get remove -y --purge \
            containerd \
            containerd.io \
            docker.io \
            docker-compose \
            docker-compose-v2 \
            runc \
            moby-containerd \
            moby-runc || true
            
          # 3. 清理残留依赖和配置文件
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          
          # 4. 更新软件源索引
          sudo apt-get update -qq
          
          # 5. 安装必要的依赖工具
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            gnupg \
            lsb-release
          
          # 6. 添加 Docker 官方 GPG 密钥和仓库
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          
          # 7. 再次更新索引以识别新仓库
          sudo apt-get update -qq
          
          # 8. 安装 Docker CE (包含 containerd.io)
          sudo apt-get install -y --no-install-recommends \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin
          
          # 9. 启动 Docker 服务
          sudo systemctl start docker
          sudo systemctl enable docker
          
          # 10. 验证安装
          docker --version
          docker info

      - name: 生成服务端专属密钥
        run: |
          mkdir -p tmate-server && cd tmate-server
          # 下载并执行密钥生成脚本
          curl -s -q https://raw.githubusercontent.com/tmate-io/tmate-ssh-server/master/create_keys.sh | bash
          # 强制修正密钥权限，避免SSH服务拒绝加载
          chmod 700 keys
          chmod 600 keys/*

      - name: 启动tmate服务端容器
        run: |
          # 清理旧容器
          docker rm -f tmate-private-server || true
          # 释放2222端口
          sudo fuser -k 2222/tcp || true
          # 修复-k参数缺失问题，显式传入密钥目录路径，解决option requires an argument: k报错
          docker run -d --name tmate-private-server \
            --net=host \
            -v ${{ github.workspace }}/tmate-server/keys:/etc/tmate-keys \
            tmate/tmate-ssh-server:latest \
            -k /etc/tmate-keys
          sleep 8
          # 校验容器是否仍在运行
          if ! docker ps --format '{{.Names}}' | grep -q tmate-private-server; then
            echo "❌ 容器启动失败，打印日志排查"
            docker logs tmate-private-server
            exit 1
          fi

      - name: 获取服务端部署信息
        id: info
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me)
          echo "server-host=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "server-port=2222" >> $GITHUB_OUTPUT
          # 提取公钥指纹
          RSA_FP=$(ssh-keygen -lf tmate-server/keys/ssh_host_rsa_key.pub | awk '{print $2}')
          ED25519_FP=$(ssh-keygen -lf tmate-server/keys/ssh_host_ed25519_key.pub | awk '{print $2}')
          echo "rsa-fingerprint=$RSA_FP" >> $GITHUB_OUTPUT
          echo "ed25519-fingerprint=$ED25519_FP" >> $GITHUB_OUTPUT
          echo "✅ 私有Tmate服务端已启动: $PUBLIC_IP:2222"

  menuconfig:
    name: ⚙️ 自定义配置菜单
    needs: tmate-selfhost-server
    if: |
      github.event.inputs.ssh == 'true' && 
      github.event.inputs.device != '全部设备' &&
      needs.tmate-selfhost-server.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
      - name: 初始化编译环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
      - name: 克隆源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
      - name: 设置配置文件变量
        run: |
          # 修复sh out of range索引越界问题，补全所有分支的变量输出
          case "$DEVICE_INPUT" in
            "512M") 
              echo "CONFIG_FILE=config/512m.config" >> $GITHUB_ENV 
              ;; 
            "256M") 
              echo "CONFIG_FILE=config/256m.config" >> $GITHUB_ENV 
              ;;
            "128M") 
              echo "CONFIG_FILE=config/128m.config" >> $GITHUB_ENV 
              ;;
            "128M-Uboot修改版") 
              echo "CONFIG_FILE=config/128muboot.config" >> $GITHUB_ENV 
              ;;
          esac
      - name: 加载软件源与基础配置
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          $GITHUB_WORKSPACE/$DIY_P2_SH
      - name: 开启私有tmate交互式SSH会话
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
        with:
          server-address: ${{ needs.tmate-selfhost-server.outputs.server-host }}:${{ needs.tmate-selfhost-server.outputs.server-port }}
          public-key: ${{ needs.tmate-selfhost-server.outputs.rsa-fingerprint }}
          ed25519-key: ${{ needs.tmate-selfhost-server.outputs.ed25519-fingerprint }}
      - name: 推送自定义配置到仓库
        run: |
          cp -f /workdir/openwrt/.config $GITHUB_WORKSPACE/${CONFIG_FILE}
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $CONFIG_FILE
          git diff --cached --quiet || (
            git commit -m "更新配置: ${CONFIG_FILE}"
            git pull --rebase origin main
            git push
          )

  build:
    name: 编译固件
    # 显式声明完整依赖，彻底消除上下文访问无效警告
    needs: [tmate-selfhost-server, menuconfig]
    runs-on: ubuntu-22.04
    # 移除always()，使用兼容全版本Actions的条件判断
    if: |
      !cancelled() &&
      contains('success skipped', needs.menuconfig.result) &&
      (github.event.inputs.ssh != 'true' || needs.tmate-selfhost-server.result == 'success')
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y libncurses5-dev python3-distutils liblzo2-dev lzop ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get autoremove --purge -qq
          sudo apt-get clean -qq
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
      - name: 克隆源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          if [ -n "${REPO_COMMIT}" ]; then cd openwrt && git checkout ${REPO_COMMIT}; fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
      - name: 加载软件源
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          $GITHUB_WORKSPACE/$DIY_P2_SH
      - name: 生成配置哈希值
        id: config-hash
        run: |
          FIRST_DEV_CONFIG="config/512m.config"
          if [ "${DEVICE_INPUT}" != "全部设备" ]; then
            case "${DEVICE_INPUT}" in
              "512M") FIRST_DEV_CONFIG="config/512m.config" ;;
              "256M") FIRST_DEV_CONFIG="config/256m.config" ;;
              "128M") FIRST_DEV_CONFIG="config/128m.config" ;;
              "128M-Uboot修改版") FIRST_DEV_CONFIG="config/128muboot.config" ;;
            esac
          fi
          cp -f $GITHUB_WORKSPACE/$FIRST_DEV_CONFIG openwrt/.config
          cd openwrt && make defconfig
          CONFIG_HASH=$(md5sum .config | awk '{print $1}')
          echo "hash=$CONFIG_HASH" >> $GITHUB_OUTPUT
      - name: 加载编译缓存
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-
      - name: 加载下载资源缓存
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-
      - name: 配置编译加速缓存
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z
      - name: 多设备循环编译
        id: compile
        run: |
          if [ "${DEVICE_INPUT}" = "全部设备" ]; then
            DEVICES="512M 256M 128M 128M-Uboot修改版"
          else
            DEVICES="${DEVICE_INPUT}"
          fi
          mkdir -p $GITHUB_WORKSPACE/firmware_collection
          cd /workdir/openwrt
          for DEV in $DEVICES; do
            echo "::group::🚀 正在编译 $DEV 设备固件"
            case "$DEV" in
              "512M") CONFIG="config/512m.config" ;;
              "256M") CONFIG="config/256m.config" ;;
              "128M") CONFIG="config/128m.config" ;;
              "128M-Uboot修改版") CONFIG="config/128muboot.config" ;;
            esac
            cp -f $GITHUB_WORKSPACE/$CONFIG .config
           
