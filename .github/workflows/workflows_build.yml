name: ImmortalWrt 固件全自动汉化编译流水线

on:
  repository_dispatch:
    types: [ "源代码更新触发编译" ]
  workflow_dispatch:
    inputs:
      device:
        description: '选择要编译的设备型号'
        required: true
        type: choice
        default: 'all'
        options:
          - '512M'
          - '256M'
          - '128M'
          - '128M-Ubootmod'
          - '全部设备' 
      repo:
        description: '指定ImmortalWrt源码仓库地址'
        required: true
        type: string
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
      branch:
        description: '指定源码分支名称，留空自动拉取默认最新分支'
        required: false
        type: string
        default: 'openwrt-24.10-6.6'
      commit:
        description: '指定源码固定Commit版本号，留空自动拉取最新提交'
        required: false
        type: string
        default: ''
      ssh:
        description: '开启远程SSH配置模式（选择「全部设备」时该选项不生效）'
        required: false
        type: boolean
        default: false
      build_ssh:
        description: '编译阶段启用备用SSH调试通道'
        required: false
        type: boolean
        default: false
      release:
        description: '编译完成后自动发布到GitHub Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '标记为预发布测试版本'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device }}
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 6G
  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo }}
  REPO_BRANCH: ${{ github.event.inputs.branch }}
  REPO_COMMIT: ${{ github.event.inputs.commit }}
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release }}
  PRERELEASE: ${{ github.event.inputs.prerelease }}
  TZ: Asia/Shanghai

jobs:
  menuconfig:
    name: ⚙️ 交互式菜单配置
    if: github.event.inputs.ssh == 'true' && github.event.inputs.device != '全部设备'
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取当前项目代码
        uses: actions/checkout@v4
      - name: 初始化系统编译依赖环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
      - name: 克隆ImmortalWrt源码仓库
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
      - name: 写入设备对应配置文件路径变量
        run: |
          case "$DEVICE_INPUT" in
            "512M") echo "CONFIG_FILE=config/512m.config" >> $GITHUB_ENV ;; 
            "256M") echo "CONFIG_FILE=config/256m.config" >> $GITHUB_ENV ;;
            "128M") echo "CONFIG_FILE=config/128m.config" >> $GITHUB_ENV ;;
            "128M-Ubootmod") echo "CONFIG_FILE=config/128muboot.config" >> $GITHUB_ENV ;;
          esac
      - name: 加载自定义Feeds源与基础配置
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp -f $GITHUB_WORKSPACE/$CONFIG_FILE .config
          $GITHUB_WORKSPACE/$DIY_P2_SH
      - name: 第一通道 - 公共tmate交互式SSH连接
        uses: tmate-actions/action-tmate@v4
        timeout-minutes: 15
        with:
          sudo: true
          args: -r 'StrictHostKeyChecking=no'
      - name: 第二通道 - 原生系统SSH服务备用连接
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          mkdir -p ~/.ssh
          # 替换为你自己的本地电脑SSH公钥，即可直接通过服务器IP连接
          echo "你自己的SSH公钥内容粘贴在这里" > ~/.ssh/authorized_keys
          sudo systemctl start sshd
          echo "✅ 原生SSH通道已启动，你可以直接使用 ssh $USER@$(curl ifconfig.me) 命令连接运行器"
          # 保持会话不自动退出，等待用户手动配置完成
          sleep 900
      - name: 自动提交自定义修改后的配置文件
        run: |
          cp -f /workdir/openwrt/.config $GITHUB_WORKSPACE/${CONFIG_FILE}
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $CONFIG_FILE
          git diff --cached --quiet || (
            git commit -m "自动更新配置: ${CONFIG_FILE}"
            git pull --rebase origin main
            git push
          )

  build:
    name: 🔨 固件编译任务
    needs: menuconfig
    if: always() && (needs.menuconfig.result == 'success' || needs.menuconfig.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取当前项目代码
        uses: actions/checkout@v4
      - name: 初始化全量编译依赖环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y libncurses5-dev python3-distutils liblzo2-dev lzop ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get autoremove --purge -qq
          sudo apt-get clean -qq
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
      - name: 克隆ImmortalWrt源码仓库
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          if [ -n "${REPO_COMMIT}" ]; then cd openwrt && git checkout ${REPO_COMMIT}; fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
      - name: 加载自定义Feeds源
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a && ./scripts/feeds install -a
          $GITHUB_WORKSPACE/$DIY_P2_SH
      - name: 生成配置唯一哈希校验值
        id: config-hash
        run: |
          FIRST_DEV_CONFIG="config/512m.config"
          if [ "${DEVICE_INPUT}" != "全部设备" ]; then
            case "$DEVICE_INPUT" in
              "512M") FIRST_DEV_CONFIG="config/512m.config" ;;
              "256M") FIRST_DEV_CONFIG="config/256m.config" ;;
              "128M") FIRST_DEV_CONFIG="config/128m.config" ;;
              "128M-Ubootmod") FIRST_DEV_CONFIG="config/128muboot.config" ;;
            esac
          fi
          cp -f $GITHUB_WORKSPACE/$FIRST_DEV_CONFIG openwrt/.config
          cd openwrt && make defconfig
          CONFIG_HASH=$(md5sum .config | awk '{print $1}')
          echo "hash=$CONFIG_HASH" >> $GITHUB_OUTPUT
      - name: 恢复编译缓存加速（CCache）
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ${{ runner.os }}-编译缓存-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-编译缓存-${{ env.REPO_BRANCH }}-
      - name: 恢复依赖包下载缓存（DL）
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-依赖包缓存-${{ env.REPO_BRANCH }}-${{ steps.config-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-依赖包缓存-${{ env.REPO_BRANCH }}-
      - name: 配置CCache加速参数
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z
      - name: 编译阶段备用SSH通道
        if: env.BUILD_SSH == 'true'
        uses: tmate-actions/action-tmate@v4
        timeout-minutes: 30
        with:
          sudo: true
      - name: 全量固件循环编译
        id: compile
        run: |
          if [ "${DEVICE_INPUT}" = "全部设备" ]; then
            DEVICES="512M 256M 128M 128M-Ubootmod"
          else
            DEVICES="${DEVICE_INPUT}"
          fi
          mkdir -p $GITHUB_WORKSPACE/firmware_collection
          cd /workdir/openwrt
          for DEV in $DEVICES; do
            echo "::group::🚀 正在编译设备固件: $DEV"
            case "$DEV" in
              "512M") CONFIG="config/512m.config" ;;
              "256M") CONFIG="config/256m.config" ;;
              "128M") CONFIG="config/128m.config" ;;
              "128M-Ubootmod") CONFIG="config/128muboot.config" ;;
            esac
            cp -f $GITHUB_WORKSPACE/$CONFIG .config
            make defconfig
            make download -j$(nproc)
            find dl -size -1024c -exec rm -f {} \;
            if make -j$(nproc) CC="ccache gcc" CXX="ccache g++"; then
              echo "✅ $DEV 固件编译成功"
            else
              make -j1 V=s || exit 1
            fi
            echo "::endgroup::"
          done
          ccache -s
          cp -rf bin/targets/*/*/* $GITHUB_WORKSPACE/firmware_collection/ 2>/dev/null || true
          echo "status=success" >> $GITHUB_OUTPUT
      - name: 上传固件到工作流产物
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_${{ env.DEVICE_INPUT }}
          path: ${{ github.workspace }}/firmware_collection/*
          compression-level: 9
      - name: 生成Release发布元信息
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          BUILD_TIME=$(date +"%Y.%m.%d-%H%M")
          echo "release_tag=$BUILD_TIME" >> $GITHUB_OUTPUT
          cat > release.txt << EOF
          ## 📦 ImmortalWrt 编译固件
          &zwnj;**编译标签版本:**&zwnj; $BUILD_TIME
          &zwnj;**源码分支:**&zwnj; $REPO_BRANCH
          &zwnj;**适配设备:**&zwnj; ${DEVICE_INPUT}
          EOF
          echo "status=success" >> $GITHUB_OUTPUT
      - name: 自动上传固件到GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            /workdir/openwrt/bin/targets/*/*/*sysupgrade.bin
            /workdir/openwrt/bin/targets/*/*/*factory.bin
      - name: 自动清理历史编译运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 9
      - name: 自动清理旧版本Release
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
