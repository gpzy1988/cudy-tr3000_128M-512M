
name: ImmortalWrt MT798x Builder

on:
  repository_dispatch:
    types: [ "Source Code Update" ]
  workflow_dispatch:
    inputs:
      device:
        description: '选择编译设备'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '512M'
          - '256M'
          - '128M'
          - '128M-Ubootmod'
          - 'DIY Custom'
      repo:
        description: '源码仓库地址'
        required: true
        type: string
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
      branch:
        description: '源码分支 (Branch)'
        required: false
        type: string
        default: 'openwrt-24.10-6.6'
      commit:
        description: '源码提交哈希 (Commit Hash, 留空则不指定)'
        required: false
        type: string
        default: ''
      ssh:
        description: '开启 Web Terminal 进行 DIY 配置 (仅当选择非 all 设备时有效)'
        required: false
        type: boolean
        default: false
      release:
        description: '编译完成后发布到 Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_INPUT: ${{ github.event.inputs.device }}
  REPO_URL: ${{ github.event.inputs.repo }}
  REPO_BRANCH: ${{ github.event.inputs.branch }}
  REPO_COMMIT: ${{ github.event.inputs.commit }}
  CONFIG_DIR: config
  DIY_P1: diy-part1.sh
  DIY_P2: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  # 阶段1: Web Terminal 交互式配置 (仅当开启 SSH 且非全量编译时触发)
  menuconfig:
    name: ⚙️ Web Terminal Config
    if: github.event.inputs.ssh == 'true' && github.event.inputs.device != 'all'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4
      
      - name: Init Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone Source Code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Determine Config File
        run: |
          case "${{ env.DEVICE_INPUT }}" in
            "512M") echo "CONFIG_FILE=${{ env.CONFIG_DIR }}/512m.config" >> $GITHUB_ENV ;;
            "256M") echo "CONFIG_FILE=${{ env.CONFIG_DIR }}/256m.config" >> $GITHUB_ENV ;;
            "128M") echo "CONFIG_FILE=${{ env.CONFIG_DIR }}/128m.config" >> $GITHUB_ENV ;;
            "128M-Ubootmod") echo "CONFIG_FILE=${{ env.CONFIG_DIR }}/128muboot.config" >> $GITHUB_ENV ;;
            "DIY Custom") echo "CONFIG_FILE=${{ env.CONFIG_DIR }}/diy-custom.config" >> $GITHUB_ENV ;;
          esac

      - name: Prepare Feeds & Config
        run: |
          [ -e feeds.conf.default ] && cp feeds.conf.default openwrt/feeds.conf.default
          chmod +x $DIY_P1 $DIY_P2
          cd openwrt
          ../$DIY_P1
          ./scripts/feeds update -a && ./scripts/feeds install -a
          # 如果存在已有配置，先加载，方便在此基础上修改
          [ -e ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
          ../$DIY_P2

      - name: Start Web Terminal (TTYd + Cloudflare)
        run: |
          # 1. 下载并安装 TTYd (Web Terminal)
          wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          chmod +x ttyd.x86_64
          
          # 2. 下载并安装 Cloudflared (内网穿透工具)
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # 3. 后台启动 TTYd，监听本地 7681 端口
          #    -c 参数设置访问密码，防止他人随意接入你的编译环境
          ./ttyd.x86_64 -p 7681 -c "openwrt123" bash &
          
          echo "⏳ Waiting for Cloudflare tunnel to start..."
          
          # 4. 启动 Cloudflare Tunnel，将本地 7681 端口暴露为公网 HTTPS 链接
          cloudflared tunnel --url http://localhost:7681 > tunnel.log 2>&1 &
          
          # 5. 等待并提取公网访问链接
          sleep 8
          TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n 1)
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to get tunnel URL. Check logs."
            cat tunnel.log
            exit 1
          fi
          
          echo "========================================"
          echo "✅ Web Terminal Ready!"
          echo "🔗 Access URL: $TUNNEL_URL"
          echo "🔑 Password: openwrt123"
          echo "⚠️  Keep this tab open. The workflow will pause here."
          echo "========================================"
          
          # 6. 阻塞 Workflow，直到你手动停止或超时
          tail -f /dev/null
        timeout-minutes: 30

      - name: Save & Push Config
        if: always()
        run: |
          # 将生成的 .config 复制回仓库目录
          cp -f /workdir/openwrt/.config $GITHUB_WORKSPACE/$CONFIG_FILE
          cd $GITHUB_WORKSPACE
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 关键修复：自动暂存本地更改，防止 pull 冲突
          git stash push -m "auto-stash"
          
          # 关键修复：动态获取当前分支名称，避免硬编码导致的找不到分支错误
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull origin $CURRENT_BRANCH --rebase
          
          git stash pop || true
          
          git add $CONFIG_FILE
          if ! git diff --cached --quiet; then
            git commit -m "Update config for ${{ env.DEVICE_INPUT }}"
            git push origin $CURRENT_BRANCH
          fi

  # 阶段2: 编译固件
  build:
    name: 🔨 Build ${{ matrix.device }}
    needs: menuconfig
    if: always() && (needs.menuconfig.result == 'success' || needs.menuconfig.result == 'skipped')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # 如果选择 all，则并行编译所有标准设备；否则只编译选中的设备
      matrix:
        device: >-
          ${{ 
            github.event.inputs.device == 'all' 
            && '["512M", "256M", "128M", "128M-Ubootmod"]' 
            || format('["{0}"]', github.event.inputs.device) 
          }}

    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd libncurses5-dev liblzo2-dev lzop
          sudo apt-get autoremove --purge -qq
          sudo apt-get clean -qq
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone Source Code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          cd openwrt
          if [ -n "${{ env.REPO_COMMIT }}" ]; then
            git checkout ${{ env.REPO_COMMIT }}
          fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load Custom Feeds
        run: |
          [ -e feeds.conf.default ] && cp feeds.conf.default openwrt/feeds.conf.default
          chmod +x $DIY_P1 $DIY_P2
          cd openwrt
          ../$DIY_P1
          ./scripts/feeds update -a && ./scripts/feeds install -a
          ../$DIY_P2

      - name: Generate Config Hash for Cache
        id: hash
        run: |
          # 确定当前矩阵设备对应的配置文件
          case "${{ matrix.device }}" in
            "512M") CONF="${{ env.CONFIG_DIR }}/512m.config" ;;
            "256M") CONF="${{ env.CONFIG_DIR }}/256m.config" ;;
            "128M") CONF="${{ env.CONFIG_DIR }}/128m.config" ;;
            "128M-Ubootmod") CONF="${{ env.CONFIG_DIR }}/128muboot.config" ;;
            "DIY Custom") CONF="${{ env.CONFIG_DIR }}/diy-custom.config" ;;
          esac
          
          # 如果配置文件不存在，创建一个空的以防报错，但通常应该存在
          [ ! -e "$CONF" ] && touch "$CONF"
          
          cp -f $CONF openwrt/.config
          cd openwrt
          make defconfig
          HASH=$(md5sum .config | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "conf_file=$CONF" >> $GITHUB_OUTPUT

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: /workdir/.ccache
          key: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-${{ steps.hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-

      - name: Cache Downloaded Files
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-dl-${{ env.REPO_BRANCH }}-${{ steps.hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-dl-${{ env.REPO_BRANCH }}-

      - name: Compile Firmware
        id: compile
        run: |
          cd /workdir/openwrt
          
          # 加载配置
          cp -f $GITHUB_WORKSPACE/${{ steps.hash.outputs.conf_file }} .config
          make defconfig
          
          # 下载源码包
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;
          
          # 开始编译
          echo "::group::Compile Start"
          if make -j$(nproc) CC="ccache gcc" CXX="ccache g++"; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "Compile failed, retrying with V=s..."
            make -j1 V=s
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "::endgroup::"
          
          # 收集固件
          mkdir -p $GITHUB_WORKSPACE/firmware
          # 关键修复：确保在 openwrt 目录下执行 cp，并使用 -r 处理可能的目录结构，忽略错误防止中断
          cp -rf bin/targets/*/*/* $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_${{ matrix.device }}_${{ env.REPO_BRANCH }}
          path: ${{ github.workspace }}/firmware/*
          compression-level: 9

      - name: Release Firmware
        if: steps.compile.outputs.status == 'success' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.REPO_BRANCH }}-${{ github.run_number }}
          name: Build ${{ env.REPO_BRANCH }} #${{ github.run_number }}
          body: |
            ## 自动编译固件
            - **设备**: ${{ matrix.device }}
            - **分支**: ${{ env.REPO_BRANCH }}
            - **时间**: ${{ env.TZ }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            /workdir/openwrt/bin/targets/*/*/*sysupgrade.bin
            /workdir/openwrt/bin/targets/*/*/*factory.bin

  # 清理旧的工作流运行记录
  clean-workflow:
    name: 🧹 Clean Old Runs
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
